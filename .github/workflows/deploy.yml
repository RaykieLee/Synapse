name: CI and production deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.24"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install API dependencies
        run: uv sync --frozen --extra dev

      - name: Run API tests
        run: uv run --frozen pytest -q

  web-build:
    name: Web lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint web
        run: pnpm lint

      - name: Build web
        run: pnpm build

  deploy:
    name: Build images and deploy
    runs-on: ubuntu-latest
    needs:
      - api-tests
      - web-build
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Classify deployment path
        id: deploy-path
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          case "${DEPLOY_PATH}" in
            /opt/synapse*)
              echo "safe=true" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "safe=false" >> "${GITHUB_OUTPUT}"
              ;;
          esac

      - name: Log in to GHCR
        if: steps.deploy-path.outputs.safe == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API image
        if: steps.deploy-path.outputs.safe == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/raykiele/synapse-api:${{ github.sha }}
          cache-from: type=gha,scope=synapse-api
          cache-to: type=gha,mode=max,scope=synapse-api

      - name: Build web image
        if: steps.deploy-path.outputs.safe == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/raykiele/synapse-web:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=/api/v1
          cache-from: type=gha,scope=synapse-web
          cache-to: type=gha,mode=max,scope=synapse-web

      - name: Write release manifest
        if: steps.deploy-path.outputs.safe == 'true'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release
          cp docker-compose.deploy-host.yml scripts/deploy-remote.sh release/
          printf 'SYNAPSE_API_IMAGE=ghcr.io/raykiele/synapse-api:%s\nSYNAPSE_WEB_IMAGE=ghcr.io/raykiele/synapse-web:%s\n' \
            "${IMAGE_TAG}" "${IMAGE_TAG}" > release/release.env
          ls -lh release

      - name: Configure SSH
        if: steps.deploy-path.outputs.safe == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${DEPLOY_SSH_KEY}" > "${HOME}/.ssh/synapse_deploy"
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/synapse_deploy" "${HOME}/.ssh/known_hosts"

      - name: Upload release
        if: steps.deploy-path.outputs.safe == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          release_dir="${DEPLOY_PATH}/releases/${IMAGE_TAG}"
          ssh_options=(-i "${HOME}/.ssh/synapse_deploy" -o IdentitiesOnly=yes -o BatchMode=yes -o ServerAliveInterval=30)

          ssh "${ssh_options[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p '${release_dir}'"
          scp "${ssh_options[@]}" -r release/. "${DEPLOY_USER}@${DEPLOY_HOST}:${release_dir}/"

      - name: Activate release
        if: steps.deploy-path.outputs.safe == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_dir="${DEPLOY_PATH}/releases/${IMAGE_TAG}"
          # The runner expands the validated path before passing it to the quoted remote command.
          # shellcheck disable=SC2029 # actionlint-shellcheck
          remote_script="sudo bash '${release_dir}/deploy-remote.sh' '${release_dir}' '${IMAGE_TAG}' '${GHCR_USERNAME}'"

          printf '%s\n' "${GHCR_TOKEN}" | ssh -i "${HOME}/.ssh/synapse_deploy" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ServerAliveInterval=30 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "${remote_script}"

      - name: Unsupported deployment path
        if: steps.deploy-path.outputs.safe != 'true'
        run: |
          echo "::error::The current remote deploy script supports DEPLOY_PATH=/opt/synapse and its subdirectories."
          exit 1
