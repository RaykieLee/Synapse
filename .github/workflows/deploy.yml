name: CI and production deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.24"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install API dependencies
        run: uv sync --frozen --extra dev

      - name: Run API tests
        run: uv run --frozen pytest -q

  web-build:
    name: Web lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint web
        run: pnpm lint

      - name: Build web
        run: pnpm build

  deploy:
    name: Build release images
    runs-on: ubuntu-latest
    needs:
      - api-tests
      - web-build
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: synapse-api:${{ github.sha }}
          cache-from: type=gha,scope=synapse-api
          cache-to: type=gha,mode=max,scope=synapse-api

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          tags: synapse-web:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=/api/v1
          cache-from: type=gha,scope=synapse-web
          cache-to: type=gha,mode=max,scope=synapse-web

      - name: Prepare release bundle
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release
          cp docker-compose.deploy-host.yml scripts/deploy-remote.sh release/
          printf 'SYNAPSE_API_IMAGE=synapse-api:%s\nSYNAPSE_WEB_IMAGE=synapse-web:%s\n' \
            "${IMAGE_TAG}" "${IMAGE_TAG}" > release/release.env

          # Only transfer the images built by this commit.
          docker save \
            "synapse-api:${IMAGE_TAG}" \
            "synapse-web:${IMAGE_TAG}" \
            | gzip -1 > release/synapse-images.tar.gz
          sha256sum release/synapse-images.tar.gz > release/synapse-images.tar.gz.sha256
          ls -lh release

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: synapse-release-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 14
