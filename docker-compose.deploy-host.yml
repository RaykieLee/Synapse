services:
  api:
    image: ${SYNAPSE_API_IMAGE:?Set SYNAPSE_API_IMAGE in release.env}
    environment:
      SYNAPSE_ENV: ${SYNAPSE_ENV:-production}
      SYNAPSE_DEBUG: ${SYNAPSE_DEBUG:-false}
      SYNAPSE_API_PREFIX: /api/v1
      SYNAPSE_DATABASE_URL: sqlite:////data/synapse/synapse.db
      SYNAPSE_JWT_SECRET: ${SYNAPSE_JWT_SECRET:?Set SYNAPSE_JWT_SECRET in .env.docker}
      SYNAPSE_AUTH_COOKIE_SECURE: ${SYNAPSE_AUTH_COOKIE_SECURE:-false}
      SYNAPSE_ATTACHMENTS_STORAGE_PATH: /data/attachments
      SYNAPSE_ATTACHMENTS_STORAGE_BACKEND: ${SYNAPSE_ATTACHMENTS_STORAGE_BACKEND:-local}
      SYNAPSE_ATTACHMENTS_S3_ENDPOINT_URL: ${SYNAPSE_ATTACHMENTS_S3_ENDPOINT_URL:-http://rustfs:9000}
      SYNAPSE_ATTACHMENTS_S3_BUCKET: ${SYNAPSE_ATTACHMENTS_S3_BUCKET:-synapse-attachments}
      SYNAPSE_ATTACHMENTS_S3_REGION: ${SYNAPSE_ATTACHMENTS_S3_REGION:-us-east-1}
      SYNAPSE_ATTACHMENTS_S3_ACCESS_KEY_ID: ${SYNAPSE_ATTACHMENTS_S3_ACCESS_KEY_ID:-}
      SYNAPSE_ATTACHMENTS_S3_SECRET_ACCESS_KEY: ${SYNAPSE_ATTACHMENTS_S3_SECRET_ACCESS_KEY:-}
      SYNAPSE_ATTACHMENTS_S3_FORCE_PATH_STYLE: ${SYNAPSE_ATTACHMENTS_S3_FORCE_PATH_STYLE:-true}
      SYNAPSE_AGENTSCOPE_REDIS_HOST: ${SYNAPSE_AGENTSCOPE_REDIS_HOST:-redis}
      SYNAPSE_AGENTSCOPE_REDIS_PORT: "6379"
      SYNAPSE_AGENTSCOPE_STORAGE_REDIS_DB: "1"
      SYNAPSE_AGENTSCOPE_BUS_REDIS_DB: "2"
      SYNAPSE_AGENTSCOPE_WORKSPACE_PATH: /data/agentscope/workspaces
      SYNAPSE_AGENTSCOPE_BLOB_PATH: /data/agentscope/blobs
      SYNAPSE_AGENTSCOPE_QDRANT_URL: ${SYNAPSE_AGENTSCOPE_QDRANT_URL:-http://qdrant:6333}
      SYNAPSE_AGENTSCOPE_KNOWLEDGE_ENABLED: ${SYNAPSE_AGENTSCOPE_KNOWLEDGE_ENABLED:-true}
      SYNAPSE_AGENTSCOPE_HUBS_ENABLED: ${SYNAPSE_AGENTSCOPE_HUBS_ENABLED:-false}
      SYNAPSE_AGENTSCOPE_SCHEDULER_ENABLED: ${SYNAPSE_AGENTSCOPE_SCHEDULER_ENABLED:-true}
      SYNAPSE_AGENTSCOPE_CHANNEL_ENABLED: ${SYNAPSE_AGENTSCOPE_CHANNEL_ENABLED:-false}
      SYNAPSE_AGENTSCOPE_CREDENTIAL_ENCRYPTION_KEY: ${SYNAPSE_AGENTSCOPE_CREDENTIAL_ENCRYPTION_KEY:?Set SYNAPSE_AGENTSCOPE_CREDENTIAL_ENCRYPTION_KEY in .env.docker}
      SYNAPSE_SCHEDULED_TASKS_ENABLED: ${SYNAPSE_SCHEDULED_TASKS_ENABLED:-true}
    volumes:
      - synapse-api-data:/data
    ports:
      - "127.0.0.1:${SYNAPSE_API_PORT:-8010}:8010"
    networks:
      - default
      - infra_backend
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8010/api/v1/health", timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    image: ${SYNAPSE_WEB_IMAGE:?Set SYNAPSE_WEB_IMAGE in release.env}
    ports:
      - "${SYNAPSE_WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - --quiet
        - http://127.0.0.1/
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  synapse-api-data:

networks:
  infra_backend:
    external: true
    name: ${SYNAPSE_INFRA_NETWORK:-infra_backend}
