[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-api"
version = "0.1.0"
description = "Synapse FastAPI service"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "bcrypt>=4.2,<5",
    "fastapi>=0.115,<1",
    "email-validator>=2.2,<3",
    "python-multipart>=0.0.9,<1",
    "croniter>=3.0,<7",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.32,<1",
    "agentscope[channel,service,storage-redis,vdb-qdrant,realtime] @ git+https://github.com/agentscope-ai/agentscope.git@42410aff0c007f6fb1687bb749d657108ec48af5",
    "ag-ui-protocol>=0.1.10,<1",
    "apscheduler>=3.10,<4",
    "redis>=5,<7",
    "cryptography>=44,<51",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
addopts = "-m 'not redis and not browser and not windows_symlink and not integration'"
markers = [
    "redis: requires a live Redis/AgentScope endpoint; run with -m redis",
    "browser: starts Vite/API and a real browser; run with -m browser",
    "windows_symlink: depends on OS symlink privileges; run with -m windows_symlink",
    "integration: exercises multiple processes or live external services",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
